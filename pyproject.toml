[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evsim-python"
version = "1.0.0"
description = "Configurable Python event-camera simulator for high-FPS frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.8,<4.12",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "matplotlib>=3.7",
]
ui = [
  "streamlit>=1.30,<2",
  "imageio-ffmpeg>=0.5",
]

[project.scripts]
evsim = "evsim.cli:main"

[tool.setuptools.packages.find]
include = ["evsim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
