[project]
name = "evsim"
version = "0.1.0"
description = "Configurable Python event-camera simulator for high-FPS frames"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.5.3",
  "opencv-python>=5.0.0.93",
  "tqdm>=4.70.1",
  "tyro>=1.0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "matplotlib>=3.11.2",
  "ruff>=0.16.7",
]
ui = [
  "streamlit>=1.63.0",
  "imageio-ffmpeg>=0.6.0",
]
gui = [
  "PySide6>=6.11.2",
]
all = [
  "evsim[dev,ui,gui]",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
evsim = "evsim.cli:main"
evsim-gui = "evsim.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
